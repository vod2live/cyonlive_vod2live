services:
  hls-fixture:
    image: python:3.12-alpine
    command: ["python", "-m", "http.server", "8000", "--directory", "/srv/hls"]
    volumes:
      - ./tests/fixtures/hls:/srv/hls:ro

  api:
    stop_grace_period: 15s
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      args:
        SERVICE: api
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    environment:
      HTTP_ADDR: :8080
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://vod2live:vod2live@postgres:5432/vod2live?sslmode=disable
      REDIS_ADDR: redis:6379
      API_KEY: ${API_KEY:-phase2-local-key}
      PLAYBACK_TOKEN_SECRET: ${PLAYBACK_TOKEN_SECRET:-development-only-playback-secret-change-me}
      PLAYBACK_TOKEN_TTL_SECONDS: ${PLAYBACK_TOKEN_TTL_SECONDS:-600}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-development-only-auth-secret-change-me-rotate-before-production}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-900}
      ALLOW_PRIVATE_HLS: ${ALLOW_PRIVATE_HLS:-true}
      HLS_MAX_MANIFEST_BYTES: ${HLS_MAX_MANIFEST_BYTES:-8388608}
      HLS_REQUEST_TIMEOUT_SECONDS: ${HLS_REQUEST_TIMEOUT_SECONDS:-15}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-*}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      hls-fixture:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  playout:
    stop_grace_period: 15s
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      args:
        SERVICE: playout
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    environment:
      DATABASE_URL: postgres://vod2live:vod2live@postgres:5432/vod2live?sslmode=disable
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      hls-fixture:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vod2live
      POSTGRES_PASSWORD: vod2live
      POSTGRES_DB: vod2live
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vod2live -d vod2live"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
