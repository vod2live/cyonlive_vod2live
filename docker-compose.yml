services:
  hls-fixture:
    image: python:3.12-alpine
    command: ["python", "-m", "http.server", "8000", "--directory", "/srv/hls"]
    volumes:
      - ./tests/fixtures/hls:/srv/hls:ro

  api:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      args:
        SERVICE: api
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://vod2live:vod2live@postgres:5432/vod2live?sslmode=disable
      REDIS_ADDR: redis:6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      hls-fixture:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  playout:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      args:
        SERVICE: playout
    environment:
      DATABASE_URL: postgres://vod2live:vod2live@postgres:5432/vod2live?sslmode=disable
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      hls-fixture:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vod2live
      POSTGRES_PASSWORD: vod2live
      POSTGRES_DB: vod2live
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vod2live -d vod2live"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
