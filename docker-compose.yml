services:
  api:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://vod2live:vod2live@postgres:5432/vod2live?sslmode=disable
      REDIS_ADDR: redis:6379
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vod2live
      POSTGRES_PASSWORD: vod2live
      POSTGRES_DB: vod2live
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
