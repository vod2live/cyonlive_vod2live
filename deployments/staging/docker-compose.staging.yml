services:
  api:
    image: ${IMAGE_REPOSITORY:-ghcr.io/vod2live/cyonlive_vod2live}:${IMAGE_TAG:?IMAGE_TAG is required}
    build: !reset null
    ports: !reset []
    environment:
      APP_ENV: staging
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_ADDR: ${REDIS_ADDR:?REDIS_ADDR is required}
      API_KEY: ${API_KEY:?API_KEY is required}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET is required}
      PLAYBACK_TOKEN_SECRET: ${PLAYBACK_TOKEN_SECRET:?PLAYBACK_TOKEN_SECRET is required}
      ALLOW_PRIVATE_HLS: "false"
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:?CORS_ALLOWED_ORIGIN is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-vod2live}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-true}
    restart: unless-stopped

  playout:
    image: ${IMAGE_REPOSITORY:-ghcr.io/vod2live/cyonlive_vod2live}:${IMAGE_TAG:?IMAGE_TAG is required}
    build: !reset null
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_ADDR: ${REDIS_ADDR:?REDIS_ADDR is required}
    restart: unless-stopped

  media-worker:
    image: ${IMAGE_REPOSITORY:-ghcr.io/vod2live/cyonlive_vod2live}:${IMAGE_TAG:?IMAGE_TAG is required}
    build: !reset null
    expose:
      - "9091"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-vod2live}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-true}
      MEDIA_KEEP_ORIGINAL: ${MEDIA_KEEP_ORIGINAL:-false}
      MEDIA_METRICS_ADDR: :9091
      MEDIA_ABANDONED_UPLOAD_TTL_HOURS: ${MEDIA_ABANDONED_UPLOAD_TTL_HOURS:-24}
      MEDIA_CLEANUP_INTERVAL_SECONDS: ${MEDIA_CLEANUP_INTERVAL_SECONDS:-900}
    restart: unless-stopped

  migration-runner:
    image: postgres:16-alpine
    profiles: ["tools"]
    working_dir: /app
    entrypoint: ["/bin/sh", "/app/scripts/migrate.sh"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    volumes:
      - ../../migrations:/app/migrations:ro
      - ../../scripts/migrate.sh:/app/scripts/migrate.sh:ro
