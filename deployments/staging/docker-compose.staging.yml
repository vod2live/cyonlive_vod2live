services:
  hls-fixture:
    profiles: ["local"]

  postgres:
    profiles: ["local"]

  redis:
    profiles: ["local"]

  minio:
    profiles: ["local"]

  api:
    image: ${IMAGE_REF:?IMAGE_REF must reference the shared image by digest}
    build: !reset null
    ports: !reset []
    environment:
      SERVICE: api
      APP_ENV: staging
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_ADDR: ${REDIS_ADDR:?REDIS_ADDR is required}
      API_KEY: ${API_KEY:?API_KEY is required}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET is required}
      PLAYBACK_TOKEN_SECRET: ${PLAYBACK_TOKEN_SECRET:?PLAYBACK_TOKEN_SECRET is required}
      ALLOW_PRIVATE_HLS: "false"
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:?CORS_ALLOWED_ORIGIN is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-vod2live}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-true}
      METRICS_API_KEY: ${METRICS_API_KEY:?METRICS_API_KEY is required}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${API_MEMORY_LIMIT:-512m}
    cpus: ${API_CPU_LIMIT:-1.0}
    pids_limit: ${API_PIDS_LIMIT:-256}
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    depends_on: !reset []
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  playout:
    image: ${IMAGE_REF:?IMAGE_REF must reference the shared image by digest}
    expose:
      - "9092"
    environment:
      SERVICE: playout
      PLAYOUT_METRICS_ADDR: :9092
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_ADDR: ${REDIS_ADDR:?REDIS_ADDR is required}
      METRICS_API_KEY: ${METRICS_API_KEY:?METRICS_API_KEY is required}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${PLAYOUT_MEMORY_LIMIT:-256m}
    cpus: ${PLAYOUT_CPU_LIMIT:-0.5}
    pids_limit: ${PLAYOUT_PIDS_LIMIT:-128}
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
    depends_on: !reset []
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9092/readyz"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

  media-worker:
    image: ${IMAGE_REF:?IMAGE_REF must reference the shared image by digest}
    expose:
      - "9091"
    environment:
      SERVICE: media-worker
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-vod2live}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-true}
      MEDIA_KEEP_ORIGINAL: ${MEDIA_KEEP_ORIGINAL:-false}
      METRICS_API_KEY: ${METRICS_API_KEY:?METRICS_API_KEY is required}
      MEDIA_TEMP_DIR: /tmp/vod2live-media
      MEDIA_METRICS_ADDR: :9091
      MEDIA_ABANDONED_UPLOAD_TTL_HOURS: ${MEDIA_ABANDONED_UPLOAD_TTL_HOURS:-24}
      MEDIA_CLEANUP_INTERVAL_SECONDS: ${MEDIA_CLEANUP_INTERVAL_SECONDS:-900}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${MEDIA_WORKER_MEMORY_LIMIT:-2g}
    cpus: ${MEDIA_WORKER_CPU_LIMIT:-2.0}
    pids_limit: ${MEDIA_WORKER_PIDS_LIMIT:-256}
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=2g
    depends_on: !reset []
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

  migration-runner:
    image: postgres:16-alpine
    profiles: ["tools"]
    working_dir: /app
    entrypoint: ["/bin/sh", "/app/scripts/migrate.sh"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    volumes:
      - ../../migrations:/app/migrations:ro
      - ../../scripts/migrate.sh:/app/scripts/migrate.sh:ro
