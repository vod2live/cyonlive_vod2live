global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules.yml
scrape_configs:
  - job_name: vod2live-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8080']
  - job_name: vod2live-media-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['media-worker:9091']
