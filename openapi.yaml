openapi: 3.0.3
info:
  title: VOD2Live Backend API
  version: 0.1.0
  description: API para catálogo HLS, canais lineares e playout VOD2Live.
servers:
  - url: http://localhost:8080
security:
  - BearerAuth: []
paths:
  /healthz:
    get:
      summary: Liveness
      security: []
      responses:
        '200': { description: Serviço ativo }
  /readyz:
    get:
      summary: Readiness de PostgreSQL e Redis
      security: []
      responses:
        '200': { description: Dependências prontas }
        '503': { description: Dependência indisponível }
  /v1/assets:
    post:
      summary: Cadastrar asset HLS
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetInput' }
      responses:
        '201': { description: Asset criado }
  /v1/assets/{id}/validate:
    post:
      summary: Validar manifesto HLS
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Manifesto validado }
        '422': { description: Manifesto inválido }
  /v1/review/assets:
    get:
      summary: Listar assets processados aguardando revisão editorial
      parameters:
        - { $ref: '#/components/parameters/PageLimit' }
        - { $ref: '#/components/parameters/PageOffset' }
      responses:
        '200': { description: Fila da organização ativa }
        '400': { description: Parâmetros de paginação inválidos }
  /v1/assets/{id}/review:
    post:
      summary: Aprovar ou rejeitar um asset processado
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                note: { type: string }
      responses:
        '200': { description: Decisão registrada }
        '409': { description: Asset ainda não está pronto ou já foi revisado }
  /v1/channels:
    post:
      summary: Criar canal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelInput' }
      responses: { '201': { description: Canal criado } }
    get:
      summary: Listar canais
      parameters:
        - { $ref: '#/components/parameters/PageLimit' }
        - { $ref: '#/components/parameters/PageOffset' }
      responses:
        '200': { description: Lista paginada de canais visíveis }
        '400': { description: Parâmetros de paginação inválidos }
  /v1/channels/{id}/start:
    post:
      summary: Iniciar playout do canal
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Canal iniciado } }
  /v1/channels/{id}/stop:
    post:
      summary: Parar playout do canal
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Canal parado } }
  /v1/channels/{id}/status:
    get:
      summary: Consultar estado do canal e playout
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Estado operacional } }
  /v1/channels/{id}/schedule:
    get:
      summary: Listar grade
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Itens da grade } }
    post:
      summary: Adicionar item à grade
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '201': { description: Item criado }, '409': { description: Conflito de horário } }
  /v1/schedule/{id}:
    patch:
      summary: Editar item da grade
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Item atualizado }, '409': { description: Conflito de horário } }
    delete:
      summary: Remover item da grade
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '204': { description: Item removido } }
  /v1/channels/{id}/master.m3u8:
    get:
      summary: Manifesto master HLS do canal
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Master HLS, content: { application/vnd.apple.mpegurl: {} } } }
  /v1/channels/{id}/playback:
    post:
      summary: Emitir URL temporária de playback para um canal
      description: Endpoint administrativo protegido por bearer token. O link emitido é assinado por HMAC e expira conforme PLAYBACK_TOKEN_TTL_SECONDS.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '201':
          description: Link temporário de playback
          content:
            application/json:
              schema:
                type: object
                required: [channel_id, playback_url, expires_at]
                properties:
                  channel_id: { type: string, format: uuid }
                  playback_url: { type: string }
                  expires_at: { type: string, format: date-time }
        '404': { description: Canal não encontrado }
  /v1/auth/bootstrap:
    post:
      summary: Criar o primeiro administrador da organização legada
      description: Só funciona uma vez. Exige a API key de bootstrap; as rotas de negócio não aceitam mais essa chave.
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, organization_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12, maxLength: 72 }
                organization_name: { type: string }
      responses: { '201': { description: Administrador criado e sessão emitida }, '409': { description: Bootstrap já concluído } }
  /v1/auth/login:
    post:
      summary: Iniciar sessão e emitir token bearer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                organization_id: { type: string, format: uuid }
      responses: { '200': { description: Sessão bearer criada }, '401': { description: Credenciais inválidas } }
  /v1/organizations:
    get:
      summary: Listar organizações do usuário
      responses: { '200': { description: Organizações associadas ao usuário } }
    post:
      summary: Criar organização e tornar o usuário administrador
      responses: { '201': { description: Organização criada } }
  /v1/tenants:
    get:
      summary: Listar tenants da organização ativa
      responses: { '200': { description: Tenants } }
    post:
      summary: Criar tenant na organização ativa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string }
                slug: { type: string }
      responses: { '201': { description: Tenant criado } }
  /v1/users:
    get:
      summary: Listar usuários da organização ativa
      responses: { '200': { description: Usuários e papéis } }
    post:
      summary: Criar usuário da organização ativa
      responses: { '201': { description: Usuário criado } }
  /v1/users/{userID}/role:
    patch:
      summary: Alterar papel de membro
      parameters:
        - { name: userID, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '204': { description: Papel atualizado }, '409': { description: Organização deve manter ao menos um administrador } }
  /v1/teams:
    get:
      summary: Listar equipes da organização ativa
      responses: { '200': { description: Equipes } }
    post:
      summary: Criar equipe
      responses: { '201': { description: Equipe criada } }
  /v1/teams/{teamID}/members:
    post:
      summary: Adicionar membro à equipe, apenas dentro da organização ativa
      parameters:
        - { name: teamID, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '204': { description: Membro adicionado }, '500': { description: Equipe ou usuário não pertence à organização } }
  /v1/libraries:
    get:
      summary: Listar bibliotecas da organização ativa
      responses: { '200': { description: Bibliotecas compartilhadas e de tenant } }
    post:
      summary: Criar biblioteca
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                tenant_id: { type: string, format: uuid, nullable: true }
      responses: { '201': { description: Biblioteca criada } }
  /v1/storage/quota:
    get:
      summary: Consultar quota e consumo de armazenamento
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses: { '200': { description: Quota total, utilizada, reservada e disponível } }
    post:
      summary: Definir quota de armazenamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quota_bytes]
              properties:
                tenant_id: { type: string, format: uuid, nullable: true }
                quota_bytes: { type: integer, format: int64, minimum: 0 }
      responses: { '200': { description: Quota atualizada } }
  /v1/libraries/{libraryID}/uploads:
    post:
      summary: Reservar quota e gerar URL pré-assinada de upload
      parameters:
        - name: libraryID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, content_type, size_bytes]
              properties:
                filename: { type: string }
                content_type: { type: string }
                size_bytes: { type: integer, format: int64 }
                tenant_id: { type: string, format: uuid, nullable: true }
      responses: { '201': { description: Upload reservado; URL pré-assinada retornada }, '422': { description: Quota insuficiente ou biblioteca inválida } }
  /v1/uploads/{uploadID}/complete:
    post:
      summary: Confirmar upload e criar job de conversão HLS
      parameters:
        - name: uploadID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [size_bytes]
              properties:
                size_bytes: { type: integer, format: int64 }
      responses: { '200': { description: Upload confirmado; conversão assíncrona iniciada }, '422': { description: Objeto ausente ou tamanho divergente } }
  /playback/{channelID}/master.m3u8:
    get:
      summary: Manifesto master HLS público com assinatura
      security: []
      parameters:
        - { name: channelID, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/PlaybackExpires' }
        - { $ref: '#/components/parameters/PlaybackToken' }
      responses:
        '200': { description: Manifesto master com variantes assinadas, content: { application/vnd.apple.mpegurl: {} } }
        '403': { description: Token ausente ou inválido }
        '410': { description: Token expirado }
  /playback/{channelID}/media/{variant}.m3u8:
    get:
      summary: Manifesto de mídia HLS assinado
      security: []
      parameters:
        - { name: channelID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: variant, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/PlaybackExpires' }
        - { $ref: '#/components/parameters/PlaybackToken' }
      responses:
        '200': { description: Manifesto com segmentos protegidos, content: { application/vnd.apple.mpegurl: {} } }
        '403': { description: Token ausente ou inválido }
        '410': { description: Token expirado }
  /playback/{channelID}/segment:
    get:
      summary: Proxy de segmento HLS com assinatura vinculada ao canal e à origem
      security: []
      parameters:
        - { name: channelID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: u, in: query, required: true, schema: { type: string, format: byte } }
        - { $ref: '#/components/parameters/PlaybackExpires' }
        - { $ref: '#/components/parameters/PlaybackToken' }
      responses:
        '200': { description: Conteúdo do segmento HLS }
        '403': { description: Token ausente ou inválido }
        '410': { description: Token expirado }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    PageOffset:
      name: offset
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    PlaybackExpires:
      name: expires
      in: query
      required: true
      schema: { type: integer, format: int64, description: Expiração Unix em segundos }
    PlaybackToken:
      name: token
      in: query
      required: true
      schema: { type: string, description: Assinatura HMAC-SHA256 codificada em base64url }
  schemas:
    AssetInput:
      type: object
      required: [title, hls_url]
      properties:
        title: { type: string }
        hls_url: { type: string, format: uri }
    ChannelInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        slug: { type: string }
        loop_enabled: { type: boolean }
        tenant_id: { type: string, format: uuid, nullable: true, description: Se ausente, o canal só pode consumir conteúdo compartilhado da organização }
