openapi: 3.0.3
info:
  title: VOD2Live Backend API
  version: 0.1.0
  description: API para catálogo HLS, canais lineares e playout VOD2Live.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Liveness
      responses:
        '200': { description: Serviço ativo }
  /readyz:
    get:
      summary: Readiness de PostgreSQL e Redis
      responses:
        '200': { description: Dependências prontas }
        '503': { description: Dependência indisponível }
  /v1/assets:
    post:
      summary: Cadastrar asset HLS
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetInput' }
      responses:
        '201': { description: Asset criado }
  /v1/assets/{id}/validate:
    post:
      summary: Validar manifesto HLS
      security: [{ ApiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Manifesto validado }
        '422': { description: Manifesto inválido }
  /v1/channels:
    post:
      summary: Criar canal
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelInput' }
      responses: { '201': { description: Canal criado } }
    get:
      summary: Listar canais
      security: [{ ApiKeyAuth: [] }]
      responses: { '200': { description: Lista de canais } }
  /v1/channels/{id}/start:
    post:
      summary: Iniciar playout do canal
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Canal iniciado } }
  /v1/channels/{id}/stop:
    post:
      summary: Parar playout do canal
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Canal parado } }
  /v1/channels/{id}/status:
    get:
      summary: Consultar estado do canal e playout
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Estado operacional } }
  /v1/channels/{id}/schedule:
    get:
      summary: Listar grade
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Itens da grade } }
    post:
      summary: Adicionar item à grade
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '201': { description: Item criado }, '409': { description: Conflito de horário } }
  /v1/schedule/{id}:
    patch:
      summary: Editar item da grade
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Item atualizado }, '409': { description: Conflito de horário } }
    delete:
      summary: Remover item da grade
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '204': { description: Item removido } }
  /v1/channels/{id}/master.m3u8:
    get:
      summary: Manifesto master HLS do canal
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Master HLS, content: { application/vnd.apple.mpegurl: {} } } }
  /v1/channels/{id}/playback:
    post:
      summary: Emitir URL temporária de playback para um canal
      description: Endpoint administrativo protegido por API key. O link emitido é assinado por HMAC e expira conforme PLAYBACK_TOKEN_TTL_SECONDS.
      security: [{ ApiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '201':
          description: Link temporário de playback
          content:
            application/json:
              schema:
                type: object
                required: [channel_id, playback_url, expires_at]
                properties:
                  channel_id: { type: string, format: uuid }
                  playback_url: { type: string }
                  expires_at: { type: string, format: date-time }
        '404': { description: Canal não encontrado }
  /playback/{channelID}/master.m3u8:
    get:
      summary: Manifesto master HLS público com assinatura
      parameters:
        - { name: channelID, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/PlaybackExpires' }
        - { $ref: '#/components/parameters/PlaybackToken' }
      responses:
        '200': { description: Manifesto master com variantes assinadas, content: { application/vnd.apple.mpegurl: {} } }
        '403': { description: Token ausente ou inválido }
        '410': { description: Token expirado }
  /playback/{channelID}/media/{variant}.m3u8:
    get:
      summary: Manifesto de mídia HLS assinado
      parameters:
        - { name: channelID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: variant, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/PlaybackExpires' }
        - { $ref: '#/components/parameters/PlaybackToken' }
      responses:
        '200': { description: Manifesto com segmentos protegidos, content: { application/vnd.apple.mpegurl: {} } }
        '403': { description: Token ausente ou inválido }
        '410': { description: Token expirado }
  /playback/{channelID}/segment:
    get:
      summary: Proxy de segmento HLS com assinatura vinculada ao canal e à origem
      parameters:
        - { name: channelID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: u, in: query, required: true, schema: { type: string, format: byte } }
        - { $ref: '#/components/parameters/PlaybackExpires' }
        - { $ref: '#/components/parameters/PlaybackToken' }
      responses:
        '200': { description: Conteúdo do segmento HLS }
        '403': { description: Token ausente ou inválido }
        '410': { description: Token expirado }
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlaybackExpires:
      name: expires
      in: query
      required: true
      schema: { type: integer, format: int64, description: Expiração Unix em segundos }
    PlaybackToken:
      name: token
      in: query
      required: true
      schema: { type: string, description: Assinatura HMAC-SHA256 codificada em base64url }
  schemas:
    AssetInput:
      type: object
      required: [title, hls_url]
      properties:
        title: { type: string }
        hls_url: { type: string, format: uri }
    ChannelInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        slug: { type: string }
        loop_enabled: { type: boolean }
