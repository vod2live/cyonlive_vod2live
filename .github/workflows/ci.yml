name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go test ./...
      - name: Go coverage
        run: |
          go test -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out
      - name: Upload Go coverage report
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-${{ github.run_id }}
          path: coverage.out
          if-no-files-found: error
          retention-days: 14
      - name: Check Go formatting
        run: test -z "$(gofmt -l $(find cmd internal pkg -name '*.go' -print))"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Go lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60.3
          args: --timeout=5m
      - run: docker compose config --quiet
      - run: IMAGE_REF=ghcr.io/vod2live/cyonlive_vod2live:ci DATABASE_URL='postgres://test:test@db:5432/test' REDIS_ADDR=redis:6379 API_KEY=test AUTH_TOKEN_SECRET=test PLAYBACK_TOKEN_SECRET=test METRICS_API_KEY=test CORS_ALLOWED_ORIGIN=https://example.test MINIO_ENDPOINT=minio:9000 MINIO_ROOT_USER=test MINIO_ROOT_PASSWORD=testpassword docker compose -f docker-compose.yml -f deployments/staging/docker-compose.staging.yml config --quiet
      - run: IMAGE_REF=ghcr.io/vod2live/cyonlive_vod2live:ci VERSION=${GITHUB_REF_NAME} COMMIT=${GITHUB_SHA} BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) docker compose build api
      - run: docker compose build minio
      - run: docker compose up -d --wait --wait-timeout 120 postgres redis hls-fixture
      - run: ./scripts/migrate.sh
      - run: ./scripts/verify-migrations.sh
      - run: VOD2LIVE_TEST_DATABASE_URL='postgres://vod2live:vod2live@localhost:5432/vod2live?sslmode=disable' go test ./internal/library -run '^TestClaimJobConcurrentWorkersClaimJobOnce$' -count=1
      - name: Start staging services from the shared image
        env:
          IMAGE_REF: ghcr.io/vod2live/cyonlive_vod2live:ci
          DATABASE_URL: postgres://vod2live:vod2live@postgres:5432/vod2live?sslmode=disable
          REDIS_ADDR: redis:6379
          API_KEY: ci-test-api-key
          AUTH_TOKEN_SECRET: ci-test-auth-token-secret
          PLAYBACK_TOKEN_SECRET: ci-test-playback-token-secret
          METRICS_API_KEY: ci-test-metrics-key
          CORS_ALLOWED_ORIGIN: https://example.test
          MINIO_ENDPOINT: minio:9000
          MINIO_ROOT_USER: test
          MINIO_ROOT_PASSWORD: testpassword
          MINIO_USE_SSL: "false"
          STAGING_SMOKE_KEEP_SERVICES: "1"
        run: |
          ./scripts/staging-smoke.sh
      - run: VOD2LIVE_TEST_DATABASE_URL='postgres://vod2live:vod2live@localhost:5432/vod2live?sslmode=disable' VOD2LIVE_TEST_MINIO_ENDPOINT='localhost:9000' go test ./internal/media -run '^TestWorkerFailurePersistsDeadJobAndObjectState$' -count=1
      - run: ./tests/integration/e2e.sh
      - run: ./tests/integration/contract.sh
      - run: ./scripts/ha-smoke.sh
      - run: PLAYBACK_URL="$(cat /tmp/vod2live-playback-url)" REQUESTS=60 CONCURRENCY=6 ./scripts/playback-load-test.sh
      - run: REQUESTS=120 CONCURRENCY=8 ./scripts/load-test.sh
      - run: ./scripts/verify-migrations.sh
      - run: mkdir -p /tmp/vod2live-ci && docker compose exec -T postgres pg_dump -Fc -U vod2live -d vod2live > /tmp/vod2live-ci/database.dump
      - run: test -s /tmp/vod2live-ci/database.dump && docker compose run --rm -T --no-deps postgres pg_restore --list < /tmp/vod2live-ci/database.dump
      - run: ./scripts/db-restore-drill.sh /tmp/vod2live-ci/database.dump
      - if: always()
        run: docker compose ps --all && docker compose logs --no-color
      - if: always()
        run: docker compose down -v
