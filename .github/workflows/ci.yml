name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go test ./...
      - run: docker compose build api playout
      - run: docker compose up -d postgres redis hls-fixture api playout
      - run: ./tests/integration/e2e.sh
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
